name: UTSClubFinder
options:
  bundleIdPrefix: com.uts.student
  deploymentTarget:
    iOS: "17.0"
targets:
  UTSClubFinder:
    type: application
    platform: iOS
    sources:
      - UTSClubFinder
    info:
      path: UTSClubFinder/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.uts.student.UTSClubFinder
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
  UTSClubFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UTSClubFinderTests
    dependencies:
      - target: UTSClubFinder
